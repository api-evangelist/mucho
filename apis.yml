name: mucho
description: >-
  Mucho (Mucho Indonesia) was an Indonesian social-commerce startup founded in 2018 and
  headquartered in South Jakarta, positioned as Indonesia's first social online shopping
  application and often described as an aspiring "Pinduoduo for Indonesia." Its mobile app let
  users buy together with friends to unlock group-buying discounts, cutting distribution layers
  by working directly with brand owners and pairing frictionless payment with logistics support.
  The company raised early / seed funding with participation from Qiming Venture Partners. Mucho
  has since shut down; its app is no longer distributed and the mucho.asia domain now resolves to
  a parked placeholder page with no product, API, or developer surface. This profile is retained
  as a defunct-company record surfaced through the Qiming portfolio graph.
